<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screen Q&A SidePanel</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #18181b;
      --card-border: #27272a;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #4ade80;
      --badge-bg: #27272a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      font-size: 13px;
      line-height: 1.5;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .status-pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      background: rgba(74, 222, 128, 0.15);
      color: var(--accent);
      border: 1px solid rgba(74, 222, 128, 0.3);
    }
    .status-pill.offline {
      background: rgba(161, 161, 170, 0.15);
      color: var(--text-muted);
      border-color: rgba(161, 161, 170, 0.3);
    }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .qa-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .qa-question {
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
      word-break: break-word;
    }
    .qa-answer {
      font-size: 13px;
      color: #e4e4e7;
      margin-bottom: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .qa-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .meta-badge {
      font-size: 10px;
      background: var(--badge-bg);
      color: var(--text-muted);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }
    .meta-badge.highlight {
      color: var(--accent);
      border: 1px solid rgba(74, 222, 128, 0.3);
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button.btn {
      background: #27272a;
      color: #f4f4f5;
      border: 1px solid #3f3f46;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button.btn:hover {
      background: #3f3f46;
    }
    button.btn-primary {
      background: #15803d;
      border-color: #16a34a;
    }
    button.btn-primary:hover {
      background: #166534;
    }
    button.btn-action {
      background: #27272a;
      color: #f4f4f5;
      border: 1px solid #3f3f46;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button.btn-action:hover {
      background: #3f3f46;
    }
    button.btn-action:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
      font-size: 12px;
    }
    .lens-banner {
      background: #141416;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 12px;
      margin-top: 16px;
    }
    .lens-header {
      font-weight: 600;
      font-size: 12px;
      margin-bottom: 4px;
      color: #f4f4f5;
    }
    .lens-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-title">Screen Q&A Study Drawer</div>
    <div class="status-pill" id="statusPill">Checking Fleetâ€¦</div>
  </header>

  <div class="section-title">Active Tab Questions</div>
  <div id="questionsList">
    <div class="empty-state">No questions detected on this page yet.<br>Press <strong>Alt+Q</strong> to toggle scanning.</div>
  </div>

  <div class="lens-banner">
    <div class="lens-header">Mobile Screen Lens (Air-Gap)</div>
    <div class="lens-desc">Point your phone camera at monitor or paper in high-volatility scenarios.</div>
    <button class="btn btn-primary" id="openLensBtn">Open Mobile Lens</button>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
